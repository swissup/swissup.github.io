<div class="progress" aria-hidden="true"></div>
<header class="site-header">
  <div class="container">
    <button class="icon-btn menu-btn" type="button" data-action="menu" aria-label="Open navigation" aria-controls="sidebar">{% include icon.html name='menu' %}</button>
    <a class="brand" href="{{ "/" | prepend: site.baseurl }}" aria-label="SwissUpLabs Docs home">
      <img src="{{ "/images/site/logo_text.png" | prepend: site.baseurl }}"
           srcset="{{ "/images/site/logo_text.png" | prepend: site.baseurl }} 1x, {{ "/images/site/logo_text@2x.png" | prepend: site.baseurl }} 2x"
           width="164" height="23" alt="SwissUpLabs"/>
      <span class="brand-tag">Docs</span>
    </a>
    <nav class="nav-main" aria-label="Main">
      {%- assign nav_url = page.url -%}
      <a href="{{ "/#modules" | prepend: site.baseurl }}"{% if nav_url contains '/extensions/' %} class="active"{% endif %}>Modules</a>
      <a href="{{ "/m2/themes/" | prepend: site.baseurl }}"{% if nav_url contains '/argento' or nav_url contains '/themes/' %} class="active"{% endif %}>Themes</a>
      <a href="https://breezefront.com/docs/installation" target="_blank" rel="noopener">Breeze</a>
      <a href="{{ "/m2/security-patches/" | prepend: site.baseurl }}"{% if nav_url contains '/security-patches/' %} class="active"{% endif %}>Security patches</a>
    </nav>
    <div class="header-spacer"></div>
    <div id="docsearch" class="header-search"></div>
    <button class="icon-btn" type="button" data-action="theme" aria-label="Toggle dark mode">{% include icon.html name='moon' class='i-moon' %}{% include icon.html name='sun' class='i-sun' %}</button>
  </div>
</header>
