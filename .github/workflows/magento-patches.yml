name: Sync Magento security patches

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magento-patches

jobs:
  sync:
    if: github.repository == 'swissup/swissup.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download Adobe patch registry
        run: node _scripts/magento-patches.mjs

      - name: Commit changes
        run: |
          git add _data/magento_patches
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security-patches: sync Adobe patch registry'
          git push
