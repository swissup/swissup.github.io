---
layout: default
title: Page Not Found
permalink: 404.html
breadcrumbs: false
body_class: no-anchors no-edit
---

<div class="not-found">
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page may have moved. Try the search or go back.</p>
  <div class="actions">
    <a class="btn" href="{{ "/" | prepend: site.baseurl }}" id="back">{% include icon.html name='arrowLeft' class='i-sm' %}Go back</a>
    <button class="btn btn-primary" type="button" data-action="search">{% include icon.html name='search' class='i-sm' %}Search the docs</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  document.getElementById('back').addEventListener('click', function (e) {
    if (history.length > 1) {
      e.preventDefault();
      history.back();
    }
  });
});
</script>
