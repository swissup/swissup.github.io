argento:
  title: Argento
  subtitle: >
    Most Advanced Magento Responsive Theme, powered with Top-Quality
    Popular Extensions
  description: >
    <p>Argento is more than just another template created for Magento.
    It was created right from the ground based on the best ecommerce stores
    practices and according to Magento developers guidelines.</p>
  images:
    - title: Argento Breeze Business
      src: /images/site/homepage/argento/breeze-business.webp
    - title: Argento Breeze Chic
      src: /images/site/homepage/argento/breeze-chic.webp
    - title: Argento Breeze Force
      src: /images/site/homepage/argento/breeze-force.webp
    - title: Argento Breeze Stripes
      src: /images/site/homepage/argento/breeze-stripes.webp
  urls:
    m1: /m1/argento/
    m2: /m2/argento/
    breeze: /m2/argento-breeze/
    hyva: /m2/argento-hyva/
    sw: /shopware/argento/

